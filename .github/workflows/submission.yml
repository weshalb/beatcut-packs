name: Validate pack submissions
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
jobs:
  submission:
    if: >-
      startsWith(github.event.issue.title, 'Pack submission:') &&
      (github.event.action == 'opened' ||
      (github.event.label.name == 'approved' &&
      github.event.sender.login == github.event.repository.owner.login))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPENCV_IO_MAX_IMAGE_PIXELS: "16000000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy<3" "opencv-python-headless<5"
      - run: python scripts/validate_submission.py
